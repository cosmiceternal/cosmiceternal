# Optional: run Jellyfin on the SAME host as the arr stack.
#
# Start everything together:
#   docker compose -f docker-compose.yml -f docker-compose.jellyfin.yml up -d
#
# If your Jellyfin lives on another machine, DON'T use this file. Instead share
# ${DATA_ROOT}/media to that machine (NFS/SMB) and follow the "Wire it into
# Jellyfin" section of the README to connect it.
#
# NOTE: PUID/PGID/TZ are inlined here on purpose — YAML anchors from the base
# compose file don't carry across to an override file.

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks: [arr]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${CONFIG_ROOT:-./config}/jellyfin:/config
      # Read-only: Jellyfin only ever needs to READ the finished library.
      - ${DATA_ROOT:-./data}/media:/media:ro
    ports:
      - ${JELLYFIN_PORT:-8096}:8096
    # --- Hardware transcoding (optional) --------------------------------------
    # Intel / AMD iGPU (VAAPI/QSV): uncomment to pass the render node through,
    # then enable it in Jellyfin -> Dashboard -> Playback.
    # devices:
    #   - /dev/dri:/dev/dri
    # NVIDIA: use the nvidia container runtime instead — see the LinuxServer docs.
